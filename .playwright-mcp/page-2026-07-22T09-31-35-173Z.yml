              - generic [ref=f2e97]:
                - generic [ref=f2e98]: Monday Mayhem Weekly - HLL Console - 0000Z Every Monday
                - generic [ref=f2e99]: "MONDAY MAYHEM Mission START: 0000Z (8:00pm EST) ENDEX: 0200Z (10:00pm EST) THIS IS AN ORGANIZED OPERATION OPEN TO PUBLIC THIS BATTLE WILL TAKE PLACE AT 0000Z (8:00pm EST), EVERY MONDAY Join the HLL Console Voice channel on Discord to rally up! Scenario: Weekly casual operation to work as a team in the game with public players. B/ACD personnel - Please keep no more than 5 troopers per squad in-game. If in armor be sure to invite/allow a non-Cav member to join you. Bravo Company, Auxiliary Combat Detachment of the 7th Cavalry Gaming Regiment is open for recruitment for console gamers. If you are looking to play Hell Let Loose in an organized milsim environment join us for tactical realism in a team environment. You can enlist today at 7cav.us/enlist! . Bravo Company is a infantry based company with two platoons of troopers. Sections specialize in a variety of tactics, including: Commando, Assault, Defence, Reconnaissance, Mechanized Infantry and Armor."
            - generic [ref=f2e100]:
              - link [ref=f2e101] [cursor=pointer]:
                - /url: /threads/27018/
              - generic [ref=f2e103]:
                - generic [ref=f2e104]: Come and play Squad with us! Every saturday @20:00UTC
                - generic [ref=f2e105]: "The 7th Cavalry Gaming Regiment, often referred to as \"7thCav\" is a long-standing Military Realism (MILSIM) unit that primarily plays first person military shooter/simulation games. The Regiment was founded in October 2002, making it one of the oldest clans in the areas the Regiment covers. We have over 500 active members within the Cav across games like Arma 3, Hell Let Loose (PC & Console), DCS World, Ready or Not, and now Squad. We are focused on tactical realism and immersive game-play, utilizing military training, tactics, and procedures that have been adapted for use in the virtual world. If you decide to enlist you must be 18+ years old with no game or VAC bans within the past 5 years for any reason. Please review our Minimum Requirements for Enlistment so you are aware of our expectations before applying. If this interests you, please enlist here and/or join our Discord. Feel free to attend our public operation every Saturday and find the details below: Server Name: =7Cav= Squad Tactical Realism START: 2000Z (15:00 EST) ENDEX: 2200Z (17:00 EST) THIS IS AN ORGANIZED EVENT OPEN TO PUBLIC THIS EVENT TAKES PLACE AT 2000Z (15:00 EST) EVERY SATURDAY Scenario: Weekly operation to work as a team, with YOU, the public. 7Cav personnel will limit our numbers per squad and keep it open for you! So come join in a for a Coordinated gaming experience!"
            - generic [ref=f2e106]:
              - link [ref=f2e107] [cursor=pointer]:
                - /url: /threads/20812/
              - generic [ref=f2e109]:
                - generic [ref=f2e110]: Pilots Wanted! | DCS World | A/ACD
                - generic [ref=f2e111]: "SCENARIO: Help populate our DCS Tactical Public Server or participate during a curated mission. This mission occurs weekly on our DCS operations every Tuesday and Saturday at 0100Z for 2 hours. S3 Operations/Public Staff will conduct an official operation open to the public. S3 Mission Controller will need to record attendance and post an AAR per standard Cav operation SOP. For all leadership slots, this is a great opportunity to gain battlefield leadership experience for ALL members, no matter your level of experience or rank! Notify S3 if you wish to participate in combined arms for ground roles operating armor, SAM sites, or logistics."
            - generic [ref=f2e112]:
              - link [ref=f2e113] [cursor=pointer]:
                - /url: /threads/18451/
              - generic [ref=f2e115]:
                - generic [ref=f2e116]: Trenched n' Tuesday Weekly 2300Z
                - generic [ref=f2e117]: "Trenched n' Tuesdays Server Name: =7Cav=Tactical Realism US East & Central Mission START: 2300Z (7:00pm EST) Mission ENDEX: 0300Z (11:00pm EST) Scenario: Weekly recruiting operation to work as a team, with the YOU, the public. Official Rules for 7 Cav members To Earn Operational Credit: 1) Be in Tactical Realism East or Central voice channels AND play on our servers for at least 1 hour total 2) 7 Cav Squad Limits: • 4 in Infantry • 2 in Tank • 1 in Recon 3) Do not lock squads 4) Spread out on both Allies and Axis"
