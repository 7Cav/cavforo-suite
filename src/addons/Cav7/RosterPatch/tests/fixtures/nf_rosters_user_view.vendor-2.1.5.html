<!--
    Provenance: the master (style_id 0) copy of the nf_rosters_user_view
    template shipped with NF/Rosters 2.1.5 (_data/templates.xml), cut down to
    the two milpac date cells and the <xf:foreach>/<xf:datarow> wrappers around
    them. Each real row carries more cells after the date one — the record's
    details, type and citation, the award's title, image and details, and the
    manage-menu cell behind a canManage* check — and every one of those is
    elided here. The date cells themselves are verbatim, which is all the
    template modifications reach.

    Recapture from the installed template when NF/Rosters is upgraded; the
    filename carries the version this copy came from.
-->
                    <xf:foreach loop="$serviceRecord" value="$record">
                        <xf:datarow>
                            <xf:cell>{{ date($record.record_date, 'Y-m-d') }}</xf:cell>
                        </xf:datarow>
                    </xf:foreach>

                    <xf:foreach loop="$awards" value="$award">
                        <xf:datarow>
                            <xf:cell>{{ date($award.award_date, 'Y-m-d') }}</xf:cell>
                        </xf:datarow>
                    </xf:foreach>
