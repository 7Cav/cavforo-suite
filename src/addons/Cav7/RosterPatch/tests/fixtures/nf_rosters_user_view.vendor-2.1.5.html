<!--
    Provenance: the master (style_id 0) copy of the nf_rosters_user_view
    template shipped with NF/Rosters 2.1.5 (_data/templates.xml), cut down to
    the two milpac date cells and the <xf:foreach>/<xf:datarow> wrappers around
    them. Every cell after the date one in each row is elided, down to the
    manage-menu cell behind a canManage* check. The date cells themselves are
    verbatim, which is all the template modifications reach.

    Recapture from that same _data/templates.xml when NF/Rosters is upgraded,
    not from the admin control panel: master templates are not editable, and so
    not listed, outside development mode. The filename carries the version this
    copy came from.
-->
                    <xf:foreach loop="$serviceRecord" value="$record">
                        <xf:datarow>
                            <xf:cell>{{ date($record.record_date, 'Y-m-d') }}</xf:cell>
                        </xf:datarow>
                    </xf:foreach>

                    <xf:foreach loop="$awards" value="$award">
                        <xf:datarow>
                            <xf:cell>{{ date($award.award_date, 'Y-m-d') }}</xf:cell>
                        </xf:datarow>
                    </xf:foreach>
