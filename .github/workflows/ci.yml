name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Enumerate the addons once and hand the list to the matrixed jobs below.
  # Names are restricted to [A-Za-z0-9_] so a directory name can never inject
  # into the run: steps that consume the matrix value.
  discover:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.list.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          addons=$(for d in src/addons/Cav7/*/; do
            name=$(basename "$d")
            [ -f "$d/addon.json" ] || continue
            case "$name" in
              *[!A-Za-z0-9_]*) echo "skipping unsafe addon dir name: $name" >&2; continue ;;
            esac
            echo "$name"
          done | jq -R . | jq -cs .)
          echo "addons=$addons" >> "$GITHUB_OUTPUT"
          echo "Addons: $addons"

  # Static build check: lint, manifest and XML validation, _output/_data
  # consistency, and a dry-run of the release zip. No XenForo.
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
    env:
      ADDON: ${{ matrix.addon }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint PHP
        run: find "src/addons/Cav7/$ADDON" -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Validate addon.json and _data XML
        run: php tools/validate-addon.php "src/addons/Cav7/$ADDON"
      - name: Check _output / _data consistency
        run: php tools/check-data-consistency.php "src/addons/Cav7/$ADDON"
      - name: Package release zip (dry-run)
        run: |
          zip=$(tools/package-addon.sh "$ADDON" --out "/tmp/$ADDON.zip")
          echo "Built $zip"
          unzip -l "$zip" | tail -n 5

  # Standalone PHP tests per addon. Addons without a tests/ directory are a no-op.
  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
    env:
      ADDON: ${{ matrix.addon }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run tests
        run: tools/run-tests.sh "$ADDON"

  # Repo-level tool tests (tools/tests/*.php). These pin the tools/ scripts
  # against failure modes the live build's happy-path run does not exercise.
  # Runs once (not per addon) and discovers every tools/tests/*.php, so new
  # tools tests are picked up with no change here. No XenForo.
  tools-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # package-addon-test.php reads the built archive through ZipArchive.
          extensions: zip
          coverage: none
      - name: Run tools tests
        run: tools/run-tools-tests.sh

  # Repo-level checks that read the tree itself rather than one addon, so they
  # are neither matrixed nor a test of a tools/ script. No XenForo.
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Check the README addon catalog against the addons that ship
        run: php tools/check-readme-catalog.php

  # The one check branch protection requires. build and test are matrixed over
  # the addon directories, so their check names move whenever an addon is added
  # or renamed: a ruleset naming them would leave a new addon ungated, and would
  # block every pull request on a removed one. This job's name never moves.
  #
  # always() is what makes it a gate rather than a formality. Without it a failed
  # dependency skips this job instead of running it, and GitHub counts a skipped
  # required check as satisfied — so the gate would go green exactly when the
  # matrix collapsed. Running unconditionally and reading the results is the only
  # way the failure reaches the ruleset.
  ci-gate:
    needs: [discover, build, test, tools-test, repo-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every upstream job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required CI job did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
