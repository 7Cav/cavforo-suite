# Keeps the GitHub Actions used by the ci and release workflows current. Actions
# are the only managed dependency in this repo: the addons are XenForo PHP and
# carry no Composer, npm, or Docker manifests, so there is nothing else to watch.
# When a new ecosystem shows up (a composer.json, a Dockerfile), add a block here.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Hold a new release for a week before opening a pull request for it. A
    # compromised action is usually caught and yanked within days of publishing,
    # and every workflow here runs with a token that can write to the repo, so
    # the week buys the ecosystem time to notice on our behalf.
    #
    # Only default-days is set: the semver-specific keys apply to package
    # managers that report a semver change, and a flat week is what we want for
    # every action regardless.
    cooldown:
      default-days: 7
    # One grouped PR for all action bumps rather than a separate PR per action.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
